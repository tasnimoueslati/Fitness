name: cicd deploy spring angular avec github action

on:
  push:
    branches: main
jobs:
  buid_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build front-end
        run: |
          docker build -t  ${{ vars.DOCKERHUB_USERNAME }}/fitconnect-frontend fitconnect-frontend
          docker push   ${{ vars.DOCKERHUB_USERNAME }}/fitconnect-frontend

      - name: build back-end
        run: |
          docker build -t  ${{ vars.DOCKERHUB_USERNAME }}/fitconnect-backend fitconnect-backtend
          docker push   ${{ vars.DOCKERHUB_USERNAME }}/fitconnect-backtend

      - name: lancement du docker compose
        run: |
          docker compose up -d
          docker compose ps -a