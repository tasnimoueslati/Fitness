apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-angular-app
  labels:
    app: deploy
  namespace: argocd 
spec:
  project: default
  source: 
    repoURL: https://github.com/tasnimoueslati/Fitness.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true
