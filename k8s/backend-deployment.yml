apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tasnim255/fitconnect-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
           
            - configMapRef:
                name: backend-config
          env:
         
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GROQ_API_KEY
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
