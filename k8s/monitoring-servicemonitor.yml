apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fitconnect-backend
  labels:
    release: my-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s

