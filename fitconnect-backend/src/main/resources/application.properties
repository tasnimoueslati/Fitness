spring.application.name=fitconnect-backend

# ==== Base de donnees MySQL ====
spring.datasource.url=jdbc:mysql://localhost:3306/sport?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==== JWT ====
# Cle secrete encodee en base64 (a changer en production, >= 256 bits)
jwt.secret=Zml0Y29ubmVjdC1haS1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTIwMjY=
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==== Groq AI ====
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile

# ==== CORS ====
app.cors.allowed-origins=http://localhost:4200

# ==== Swagger ====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==== Upload fichiers ====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
server.port=8090

# ==== Monitoring / Actuator ====
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
